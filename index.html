<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural em Tempo Real</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-indicator {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #10B981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            min-height: 300px;
        }

        canvas {
            width: 100% !important;
            height: 280px !important;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: 500;
        }

        .log-panel {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #94A3B8;
            background: #10172A;
            padding: 8px 12px;
            border-radius: 5px;
            border: 1px solid #1E293B;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES</span>
        <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span>AO VIVO</span>
        </div>
    </div>

    <!-- Campo para inserir os Links dos CSVs das Planilhas -->
    <div class="controls">
        <div class="input-group">
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJrkjhKTIPab6OUPAB8jJbrLZ4fcL1c9Hag230BqNA7WVQV9s_5Q3ILW9rdmZ43BI1pNvRsDmPpQJc/pub?gid=1183749713&single=true&output=csv" placeholder="Link do CSV da Aba de Dados...">
        </div>
        <div class="input-group">
            <input type="text" id="csvFftUrl" value="" placeholder="Link do CSV da Aba FFT (opcional)...">
            <button onclick="carregarDadosManualmente()">Forçar Atualização</button>
            <span id="lastUpdate" class="status-badge">Conectando...</span>
        </div>
    </div>

    <!-- Indicadores KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL ACUMULADO DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">0</div>
        </div>
    </div>

    <!-- Seção dos Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <div class="log-panel" id="logConsole">Status: Inicializando sistema...</div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;

        let totalLeiturasAcumuladas = 0;
        let tamanhoUltimaLeituraDados = 0;

        function logMsg(msg) {
            document.getElementById('logConsole').innerText = 'Status: ' + msg;
        }

        function parseNum(val) {
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            if (!val) return 0;
            let n = parseFloat(String(val).replace(',', '.'));
            return isNaN(n) ? 0 : n;
        }

        function formatarUrlGoogleSheets(url) {
            if (!url) return '';
            let urlFormatada = url.trim();
            if (urlFormatada.includes('pubhtml')) {
                urlFormatada = urlFormatada.replace('pubhtml', 'pub');
            }
            if (!urlFormatada.includes('output=csv')) {
                urlFormatada += (urlFormatada.includes('?') ? '&' : '?') + 'output=csv';
            }
            return urlFormatada;
        }

        function inicializarGraficos() {
            try {
                const ctxAcel = document.getElementById('chartAceleracao').getContext('2d');
                chartAcelInstance = new Chart(ctxAcel, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            { label: 'Eixo X', data: [], borderColor: '#EF4444', borderWidth: 1.5, fill: false, pointRadius: 0 },
                            { label: 'Eixo Y', data: [], borderColor: '#10B981', borderWidth: 1.5, fill: false, pointRadius: 0 },
                            { label: 'Eixo Z', data: [], borderColor: '#3B82F6', borderWidth: 1.5, fill: false, pointRadius: 0 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            title: { display: true, text: '1. Tendência Temporal de Aceleração (Eixos X, Y, Z)', color: '#F8FAFC' },
                            legend: { labels: { color: '#CBD5E1' } }
                        },
                        scales: {
                            x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                        }
                    }
                });

                const ctxFFT = document.getElementById('chartFFT').getContext('2d');
                chartFFTInstance = new Chart(ctxFFT, {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Magnitude (g)',
                            data: [],
                            backgroundColor: '#8B5CF6'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            title: { display: true, text: '2. Espectro de Frequência (Aba FFT)', color: '#F8FAFC' },
                            legend: { display: false }
                        },
                        scales: {
                            x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                        }
                    }
                });
                logMsg('Gráficos inicializados com sucesso.');
            } catch (err) {
                logMsg('Erro ao criar gráficos: ' + err.message);
            }
        }

        function carregarDadosManualmente() {
            tamanhoUltimaLeituraDados = 0;
            sincronizarTudo();
        }

        function sincronizarTudo() {
            carregarDadosTemporais();
            carregarDadosFFT();
        }

        function carregarDadosTemporais() {
            let urlRaw = document.getElementById('csvUrl').value;
            let url = formatarUrlGoogleSheets(urlRaw);
            if (!url) {
                logMsg('Insira uma URL válida para a planilha.');
                return;
            }

            const urlSemCache = url + '&_t=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosTemporais(results.data);
                        document.getElementById('lastUpdate').innerText = 'Atualizado às ' + new Date().toLocaleTimeString();
                    } else {
                        logMsg('Planilha lida, porém nenhum dado foi encontrado.');
                    }
                },
                error: function(err) {
                    logMsg('Erro ao baixar CSV Principal: Verifique o acesso público da planilha.');
                }
            });
        }

        function processarDadosTemporais(data) {
            const quantidadeAtual = data.length;

            if (quantidadeAtual > tamanhoUltimaLeituraDados) {
                const novosDadosCount = quantidadeAtual - tamanhoUltimaLeituraDados;
                totalLeiturasAcumuladas += novosDadosCount;
                tamanhoUltimaLeituraDados = quantidadeAtual;

                let tempos = [];
                let acelX = [];
                let acelY = [];
                let acelZ = [];
                let maxZ = 0;
                let ultimoStatus = "Normal";

                data.forEach((row, index) => {
                    let keys = Object.keys(row);
                    let getKey = (possibleNames) => {
                        let k = keys.find(key => possibleNames.some(p => key.toLowerCase().includes(p.toLowerCase())));
                        return k ? row[k] : null;
                    };

                    let t = parseNum(getKey(['Tempo (s)', 'Tempo', 'Time']) || index);
                    let x = parseNum(getKey(['Aceleração X', 'Aceleraçao X', 'Eixo X', 'X']));
                    let y = parseNum(getKey(['Aceleração Y', 'Aceleraçao Y', 'Eixo Y', 'Y']));
                    let z = parseNum(getKey(['Aceleração Z', 'Aceleraçao Z', 'Eixo Z', 'Z']));

                    tempos.push(t);
                    acelX.push(x);
                    acelY.push(y);
                    acelZ.push(z);

                    if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
                    let statusVal = getKey(['Status']);
                    if (statusVal) ultimoStatus = statusVal;
                });

                document.getElementById('kpiStatus').innerText = ultimoStatus;
                document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
                document.getElementById('kpiLeituras').innerText = totalLeiturasAcumuladas.toLocaleString('pt-BR');

                if (chartAcelInstance) {
                    chartAcelInstance.data.labels = tempos;
                    chartAcelInstance.data.datasets[0].data = acelX;
                    chartAcelInstance.data.datasets[1].data = acelY;
                    chartAcelInstance.data.datasets[2].data = acelZ;
                    chartAcelInstance.update('none');
                }

                logMsg(`Sucesso! ${data.length} linhas lidas da planilha.`);
            }
        }

        function carregarDadosFFT() {
            let urlFftRaw = document.getElementById('csvFftUrl').value;
            let urlFft = formatarUrlGoogleSheets(urlFftRaw);

            if (!urlFft) return;

            const urlFftSemCache = urlFft + '&_t=' + new Date().getTime();

            Papa.parse(urlFftSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosFFT(results.data);
                    }
                },
                error: function(err) {
                    // FFT é opcional, falha silenciosa no log secundário
                }
            });
        }

        function processarDadosFFT(data) {
            let frequencias = [];
            let magnitudes = [];

            data.forEach(row => {
                let keys = Object.keys(row);
                let getKey = (possibleNames) => {
                    let k = keys.find(key => possibleNames.some(p => key.toLowerCase().includes(p.toLowerCase())));
                    return k ? row[k] : null;
                };

                let freq = parseNum(getKey(['Frequência', 'Frequencia', 'Freq']));
                let mag = parseNum(getKey(['Magnitude', 'Amplitude', 'Aceleração']));

                frequencias.push(freq.toFixed(2));
                magnitudes.push(mag.toFixed(4));
            });

            if (frequencias.length > 0 && chartFFTInstance) {
                chartFFTInstance.data.labels = frequencias;
                chartFFTInstance.data.datasets[0].data = magnitudes;
                chartFFTInstance.update('none');
            }
        }

        // Execução ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            inicializarGraficos();
            sincronizarTudo();
            setInterval(sincronizarTudo, 2000);
        });
    </script>
</body>
</html>
