<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: 500;
        }

        label {
            color: #CBD5E1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        ⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES
    </div>

    <!-- Campo para inserir os Links dos CSVs das Planilhas -->
    <div class="controls">
        <div class="input-group">
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJrkjhKTIPab6OUPAB8jJbrLZ4fcL1c9Hag230BqNA7WVQV9s_5Q3ILW9rdmZ43BI1pNvRsDmPpQJc/pub?gid=1183749713&single=true&output=csv" placeholder="Link do CSV da Aba de Dados...">
        </div>
        <div class="input-group">
            <input type="text" id="csvFftUrl" value="" placeholder="Link do CSV da Aba FFT (opcional)...">
            <button onclick="carregarDados()">Atualizar Agora</button>
            <button onclick="reiniciarDados()" style="background-color: #EF4444;">Zerar Leituras</button>
            <span id="lastUpdate" class="status-badge">Carregando dados...</span>
        </div>
        <div class="input-group">
            <label for="limiteExibicao">Exibir últimas N leituras no gráfico (0 = todas):</label>
            <input type="number" id="limiteExibicao" value="50" min="0" step="5" style="max-width:120px;">
            <span id="janelaAtual" class="status-badge">Exibindo: 0 leituras</span>
        </div>
    </div>

    <!-- Indicadores KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">0</div>
        </div>
    </div>

    <!-- Seção dos Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;

        // Guarda as leituras acumuladas
        let leiturasAcumuladas = [];

        function parseNum(val) {
            if (typeof val === 'number') return val;
            if (val === null || val === undefined || val === '') return null;
            let str = String(val).trim().replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? null : num;
        }

        function obterValorColuna(row, palavrasChave) {
            if (!row) return null;
            const chaves = Object.keys(row);
            for (let chave of chaves) {
                const chaveNorm = chave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                for (let pc of palavrasChave) {
                    if (chaveNorm.includes(pc)) {
                        let v = parseNum(row[chave]);
                        if (v !== null) return v;
                    }
                }
            }
            return null;
        }

        function inicializarGraficos() {
            const ctxAcel = document.getElementById('chartAceleracao').getContext('2d');
            chartAcelInstance = new Chart(ctxAcel, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Eixo X', data: [], borderColor: '#EF4444', borderWidth: 1.5, fill: false, pointRadius: 2 },
                        { label: 'Eixo Y', data: [], borderColor: '#10B981', borderWidth: 1.5, fill: false, pointRadius: 2 },
                        { label: 'Eixo Z', data: [], borderColor: '#3B82F6', borderWidth: 1.5, fill: false, pointRadius: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '1. Histórico Sequencial de Aceleração (1, 2, 3, 4, 5...)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Número da Leitura', color: '#CBD5E1' },
                            ticks: { color: '#CBD5E1' },
                            grid: { color: '#334155' }
                        },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });

            const ctxFFT = document.getElementById('chartFFT').getContext('2d');
            chartFFTInstance = new Chart(ctxFFT, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Magnitude (g)',
                        data: [],
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência (Aba FFT)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Frequência (Hz)', color: '#CBD5E1' },
                            ticks: { color: '#CBD5E1' },
                            grid: { color: '#334155' }
                        },
                        y: {
                            title: { display: true, text: 'Magnitude / Amplitude', color: '#CBD5E1' },
                            ticks: { color: '#CBD5E1' },
                            grid: { color: '#334155' }
                        }
                    }
                }
            });
        }

        function reiniciarDados() {
            leiturasAcumuladas = [];
            carregarDados();
        }

        function carregarDados() {
            let url = document.getElementById('csvUrl').value.trim();
            if (!url) return;

            if (url.includes('pubhtml')) {
                url = url.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlSemCache = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosComGarantia(results.data);
                        document.getElementById('lastUpdate').innerText = 'Última atualização: ' + new Date().toLocaleTimeString();
                    } else {
                        document.getElementById('lastUpdate').innerText = 'Aviso: CSV sem dados disponíveis.';
                    }
                },
                error: function(err) {
                    console.error('Erro ao carregar o CSV:', err);
                    document.getElementById('lastUpdate').innerText = 'Erro ao conectar à planilha.';
                }
            });

            carregarDadosFFT(url);
        }

        function carregarDadosFFT(urlBase) {
            let urlFft = document.getElementById('csvFftUrl').value.trim();
            if (!urlFft) return; // Só carrega se o usuário informar a URL da FFT

            if (urlFft.includes('pubhtml')) {
                urlFft = urlFft.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlFftSemCache = urlFft + (urlFft.includes('?') ? '&' : '?') + '_t=' + Date.now();

            Papa.parse(urlFftSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosFFT(results.data);
                    }
                }
            });
        }

        // 🛡️ MANTÉM OS DADOS ACUMULADOS E IMPEDE QUE A CONTAGEM VOLTE PARA TRÁS
        function processarDadosComGarantia(novosDados) {
            // Se o Google Sheets enviar mais dados do que temos, atualizamos o histórico acumulado
            if (novosDados.length >= leiturasAcumuladas.length) {
                leiturasAcumuladas = novosDados;
            }
            // Se o Google Sheets enviar menos dados (devido a cache temporário antigo), mantemos as leiturasAcumuladas!

            renderizarPainel(leiturasAcumuladas);
        }

        function renderizarPainel(data) {
            if (!data || data.length === 0) return;

            // 1. Atualizar KPIs
            let maxZ = 0;
            data.forEach(row => {
                let z = obterValorColuna(row, ['aceleracao z', 'acel z', 'eixo z', 'z']) ?? 0;
                if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
            });

            let ultimoStatus = "Normal";
            const ultimaLinha = data[data.length - 1];
            if (ultimaLinha) {
                for (let k in ultimaLinha) {
                    if (k.toLowerCase().includes('status')) {
                        ultimoStatus = ultimaLinha[k];
                        break;
                    }
                }
            }

            document.getElementById('kpiStatus').innerText = ultimoStatus;
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = data.length.toLocaleString('pt-BR');

            // 2. Limite visual de exibição
            let limite = parseInt(document.getElementById('limiteExibicao').value) || 0;
            let dadosExibicao = data;
            let inicioIndice = 1;

            if (limite > 0 && data.length > limite) {
                dadosExibicao = data.slice(data.length - limite);
                inicioIndice = data.length - limite + 1;
            }

            let labels = [];
            let pontosX = [];
            let pontosY = [];
            let pontosZ = [];

            dadosExibicao.forEach((row, idx) => {
                let numeroLeitura = inicioIndice + idx;
                labels.push(numeroLeitura.toString()); // Eixo X: 1, 2, 3, 4, 5...

                pontosX.push(obterValorColuna(row, ['aceleracao x', 'acel x', 'eixo x', 'x']) ?? 0);
                pontosY.push(obterValorColuna(row, ['aceleracao y', 'acel y', 'eixo y', 'y']) ?? 0);
                pontosZ.push(obterValorColuna(row, ['aceleracao z', 'acel z', 'eixo z', 'z']) ?? 0);
            });

            // Atualiza o gráfico de aceleração
            chartAcelInstance.data.labels = labels;
            chartAcelInstance.data.datasets[0].data = pontosX;
            chartAcelInstance.data.datasets[1].data = pontosY;
            chartAcelInstance.data.datasets[2].data = pontosZ;
            chartAcelInstance.update('none');

            document.getElementById('janelaAtual').innerText = 
                `Exibindo leituras: ${inicioIndice} a ${inicioIndice + dadosExibicao.length - 1}`;
        }

        function processarDadosFFT(data) {
            let frequencias = [];
            let magnitudes = [];
            let colunas = Object.keys(data[0] || {});

            data.forEach((row) => {
                let freq = obterValorColuna(row, ['frequenc', 'freq', 'hz']);
                let mag = obterValorColuna(row, ['magnitud', 'amplitud', 'acelerac', 'mag', 'g']);

                if (freq === null && colunas.length >= 1) freq = parseNum(row[colunas[0]]);
                if (mag === null && colunas.length >= 2) mag = parseNum(row[colunas[1]]);

                if (freq !== null && mag !== null) {
                    frequencias.push(Number.isInteger(freq) ? freq.toString() : freq.toFixed(2));
                    magnitudes.push(mag);
                }
            });

            if (frequencias.length > 0) {
                chartFFTInstance.data.labels = frequencias;
                chartFFTInstance.data.datasets[0].data = magnitudes;
                chartFFTInstance.update('none');
            }
        }

        document.getElementById('limiteExibicao').addEventListener('change', () => renderizarPainel(leiturasAcumuladas));

        inicializarGraficos();
        carregarDados();
        setInterval(carregarDados, 3000);
    </script>
</body>
</html>
