<script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;

        function carregarDados() {
            let url = document.getElementById('csvUrl').value.trim();
            if (!url) {
                alert('Por favor, insira a URL do arquivo CSV publicado.');
                return;
            }

            if (url.includes('pubhtml')) {
                url = url.replace('pubhtml', 'pub') + '&output=csv';
            }

            // Timestamp único para ignorar o cache do navegador
            const urlSemCache = url + (url.includes('?') ? '&' : '?') + '_t=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDados(results.data);
                    }
                },
                error: function(err) {
                    console.error('Erro ao carregar os dados:', err);
                }
            });
        }

        function processarDados(data) {
            // 1. Filtrar e parsear apenas dados numéricos válidos
            let leiturasLimpas = [];

            data.forEach(row => {
                let t = parseFloat(row['Tempo (s)']);
                let x = parseFloat(row['Aceleração X (g)']);
                let y = parseFloat(row['Aceleração Y (g)']);
                let z = parseFloat(row['Aceleração Z (g)']);
                let status = row['Status'] || "Normal";

                if (!isNaN(t) && !isNaN(x) && !isNaN(y) && !isNaN(z)) {
                    leiturasLimpas.push({ tempo: t, x: x, y: y, z: z, status: status });
                }
            });

            if (leiturasLimpas.length === 0) return;

            // 2. ORDENAR os dados pelo tempo crescente (Resolve o "ir e voltar" no gráfico)
            leiturasLimpas.sort((a, b) => a.tempo - b.tempo);

            let tempos = [];
            let acelX = [];
            let acelY = [];
            let acelZ = [];
            let maxZ = 0;
            let ultimoStatus = leiturasLimpas[leiturasLimpas.length - 1].status;

            leiturasLimpas.forEach(item => {
                tempos.push(item.tempo);
                acelX.push(item.x);
                acelY.push(item.y);
                acelZ.push(item.z);

                if (Math.abs(item.z) > maxZ) maxZ = Math.abs(item.z);
            });

            // 3. Atualizar KPIs com dados devidamente ordenados
            document.getElementById('kpiStatus').innerText = ultimoStatus;
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = leiturasLimpas.length;

            // 4. Renderizar Gráficos
            renderizarGraficoAceleracao(tempos, acelX, acelY, acelZ);
            renderizarGraficoFFT(acelX, tempos);
        }

        function renderizarGraficoAceleracao(tempos, x, y, z) {
            const ctx = document.getElementById('chartAceleracao').getContext('2d');
            if (chartAcelInstance) chartAcelInstance.destroy();

            chartAcelInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: tempos,
                    datasets: [
                        { label: 'Eixo X', data: x, borderColor: '#EF4444', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Y', data: y, borderColor: '#10B981', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Z', data: z, borderColor: '#3B82F6', borderWidth: 1.5, fill: false, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '1. Tendência Temporal de Aceleração (Eixos X, Y, Z)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function renderizarGraficoFFT(sinalX, tempos) {
            const N = sinalX.length;
            if (N < 2) return;

            // Cálculo do intervalo médio de amostragem dt
            let diffSum = 0;
            let validCount = 0;
            for (let i = 1; i < N; i++) {
                let diff = tempos[i] - tempos[i - 1];
                if (diff > 0) {
                    diffSum += diff;
                    validCount++;
                }
            }

            let dt = validCount > 0 ? (diffSum / validCount) : 0.01;
            const Fs = 1 / dt;

            let freqs = [];
            let magnitudes = [];

            const numBins = Math.floor(N / 2);
            for (let k = 0; k < numBins; k++) {
                let real = 0;
                let imag = 0;
                let freq = (k * Fs) / N;

                for (let n = 0; n < N; n++) {
                    let angle = (2 * Math.PI * k * n) / N;
                    real += sinalX[n] * Math.cos(angle);
                    imag -= sinalX[n] * Math.sin(angle);
                }

                let mag = (Math.sqrt(real * real + imag * imag) / N) * 2;
                freqs.push(freq.toFixed(2));
                magnitudes.push(mag.toFixed(4));
            }

            const ctx = document.getElementById('chartFFT').getContext('2d');
            if (chartFFTInstance) chartFFTInstance.destroy();

            chartFFTInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: freqs,
                    datasets: [{
                        label: 'Magnitude (g)',
                        data: magnitudes,
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência - Eixo X (FFT)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        // Executa o carregamento inicial ao abrir a página
        carregarDados();

        // Atualiza os dados automaticamente a cada 10 segundos
        setInterval(carregarDados, 10000);
    </script>
