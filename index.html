<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }
    </style>
</head>
<body>

    <div class="header">
        ⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES
    </div>

    <div class="controls">
        <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJrkjhKTIPab6OUPAB8jJbrLZ4fcL1c9Hag230BqNA7WVQV9s_5Q3ILW9rdmZ43BI1pNvRsDmPpQJc/pub?gid=1183749713&single=true&output=csv" placeholder="Cole o Link do CSV Publicado da sua Planilha aqui...">
        <button onclick="carregarDados()">Carregar Dados</button>
    </div>

    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">A carregar...</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">MAGNITUDE MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">--</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;

        function converterNumero(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            let limpo = val.toString().trim().replace(',', '.');
            return parseFloat(limpo) || 0;
        }

        function carregarDados() {
            let urlInput = document.getElementById('csvUrl').value.trim();
            if (!urlInput) return;

            let url = urlInput;
            if (url.includes('pubhtml')) {
                url = url.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlSemCache = url + (url.includes('?') ? '&' : '?') + '_t=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDados(results.data);
                    }
                },
                error: function(err) {
                    console.error('Erro ao ler CSV com PapaParse:', err);
                }
            });
        }

        function processarDados(data) {
            let rotulos = [];
            let magX = [];
            let magY = [];
            let magZ = [];
            let freqsFFT = [];
            let magFFT = [];
            let maxZ = 0;

            data.forEach((row, idx) => {
                let chaves = Object.keys(row);
                let keyTempo = chaves.find(k => k.toLowerCase().includes('tempo')) || chaves[0];
                let keyMagX = chaves.find(k => k.toLowerCase().includes('mag x')) || chaves[2];
                let keyMagY = chaves.find(k => k.toLowerCase().includes('mag y')) || chaves[4];
                let keyMagZ = chaves.find(k => k.toLowerCase().includes('mag z')) || chaves[6];
                let keyFreqX = chaves.find(k => k.toLowerCase().includes('freq x')) || chaves[1];

                let tempo = converterNumero(row[keyTempo]);
                let x = converterNumero(row[keyMagX]);
                let y = converterNumero(row[keyMagY]);
                let z = converterNumero(row[keyMagZ]);
                let freqX = converterNumero(row[keyFreqX]);

                rotulos.push(tempo ? `${tempo}s (#${idx+1})` : `#${idx+1}`);
                magX.push(x);
                magY.push(y);
                magZ.push(z);

                freqsFFT.push(freqX.toFixed(2));
                magFFT.push(x);

                if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
            });

            document.getElementById('kpiStatus').innerText = maxZ > 0.5 ? "Alerta" : "Normal";
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = data.length;

            renderizarGraficoAceleracao(rotulos, magX, magY, magZ);
            renderizarGraficoFFT(freqsFFT, magFFT);
        }

        function renderizarGraficoAceleracao(rotulos, x, y, z) {
            const ctx = document.getElementById('chartAceleracao').getContext('2d');
            if (chartAcelInstance) chartAcelInstance.destroy();

            chartAcelInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: rotulos,
                    datasets: [
                        { label: 'Mag X (g)', data: x, borderColor: '#EF4444', borderWidth: 1.5, fill: false },
                        { label: 'Mag Y (g)', data: y, borderColor: '#10B981', borderWidth: 1.5, fill: false },
                        { label: 'Mag Z (g)', data: z, borderColor: '#3B82F6', borderWidth: 1.5, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '1. Tendência de Magnitude por Leitura (Eixos X, Y, Z)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function renderizarGraficoFFT(freqs, magnitudes) {
            const ctx = document.getElementById('chartFFT').getContext('2d');
            if (chartFFTInstance) chartFFTInstance.destroy();

            chartFFTInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: freqs,
                    datasets: [{
                        label: 'Mag X (g)',
                        data: magnitudes,
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência - Freq X (Hz)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        carregarDados();
        setInterval(carregarDados, 5000);
    </script>
</body>
</html>
