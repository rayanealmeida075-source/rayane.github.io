<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural - Tempo Real</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .live-indicator {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #10B981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"], select {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }
        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2563EB; }
        .status-badge {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: 500;
        }
        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }
        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }
        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            height: 350px;
        }
        .log-panel {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #94A3B8;
            background: #1E293B;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES</span>
        <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span>AO VIVO</span>
        </div>
    </div>

    <div class="controls">
        <div class="input-group">
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vRxYvgf_Qo-6dJWXBzVg-_QXo9WeDNCFct6COPkWpEX1pZJVqJzrXLOWj1roJCPeJlsgfmJDCSd7tgX/pub?gid=1860750382&single=true&output=csv" placeholder="Link do CSV da Aba de Dados...">
            <select id="intervaloSelect" onchange="alterarIntervalo()">
                <option value="500">Atualizar a cada: 0.5s (Ultra Rápido)</option>
                <option value="1000" selected>Atualizar a cada: 1.0s (Rápido)</option>
                <option value="2000">Atualizar a cada: 2.0s (Normal)</option>
            </select>
        </div>
        <div class="input-group">
            <input type="text" id="csvFftUrl" value="" placeholder="Link do CSV da Aba FFT (opcional)...">
            <button onclick="carregarDadosManualmente()">Forçar Atualização</button>
            <span id="lastUpdate" class="status-badge">Aguardando dados...</span>
        </div>
    </div>

    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL ACUMULADO DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">0</div>
        </div>
    </div>

    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <div class="log-panel">
        <span id="logStatus">Status: Inicializando sistema...</span>
        <span id="logLatency">Latência: -- ms</span>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;
        let totalLeiturasAcumuladas = 0;
        let timerLoop = null;

        function setLog(msg) {
            document.getElementById('logStatus').innerText = 'Status: ' + msg;
        }

        function parseNum(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;
            let str = String(val).trim().replace(',', '.');
            let n = parseFloat(str);
            return isNaN(n) ? 0 : n;
        }

        function formatarUrlCSV(url) {
            if (!url) return '';
            let cleanUrl = url.trim();
            if (cleanUrl.includes('pubhtml')) {
                cleanUrl = cleanUrl.replace('pubhtml', 'pub');
            }
            if (!cleanUrl.includes('output=csv')) {
                cleanUrl += (cleanUrl.includes('?') ? '&' : '?') + 'output=csv';
            }
            return cleanUrl;
        }

        function inicializarGraficos() {
            try {
                const ctxAcel = document.getElementById('chartAceleracao').getContext('2d');
                chartAcelInstance = new Chart(ctxAcel, {
                    type: 'line',
                    data: {
                        labels: [],
                        datasets: [
                            { label: 'Eixo X', data: [], borderColor: '#EF4444', backgroundColor: '#EF4444', borderWidth: 2, fill: false, pointRadius: 1, tension: 0.1 },
                            { label: 'Eixo Y', data: [], borderColor: '#10B981', backgroundColor: '#10B981', borderWidth: 2, fill: false, pointRadius: 1, tension: 0.1 },
                            { label: 'Eixo Z', data: [], borderColor: '#3B82F6', backgroundColor: '#3B82F6', borderWidth: 2, fill: false, pointRadius: 1, tension: 0.1 }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            title: { display: true, text: '1. Tendência Temporal de Aceleração (Eixos X, Y, Z)', color: '#F8FAFC' },
                            legend: { labels: { color: '#CBD5E1' } }
                        },
                        scales: {
                            x: { ticks: { color: '#CBD5E1', maxRotation: 0 }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                        }
                    }
                });

                const ctxFFT = document.getElementById('chartFFT').getContext('2d');
                chartFFTInstance = new Chart(ctxFFT, {
                    type: 'bar',
                    data: {
                        labels: [],
                        datasets: [{
                            label: 'Magnitude (g)',
                            data: [],
                            backgroundColor: '#8B5CF6'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        plugins: {
                            title: { display: true, text: '2. Espectro de Frequência (Aba FFT)', color: '#F8FAFC' },
                            legend: { display: false }
                        },
                        scales: {
                            x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                            y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                        }
                    }
                });
                setLog('Gráficos inicializados com sucesso.');
            } catch (e) {
                setLog('Erro na criação dos gráficos: ' + e.message);
            }
        }

        function sincronizarTudo() {
            let tInicio = performance.now();
            carregarDadosTemporais(() => {
                let tFim = performance.now();
                document.getElementById('logLatency').innerText = `Latência: ${Math.round(tFim - tInicio)} ms`;
            });
            carregarDadosFFT();
        }

        function carregarDadosTemporais(callback) {
            let url = formatarUrlCSV(document.getElementById('csvUrl').value);
            if (!url) return;

            const urlSemCache = url + '&_nocache=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosTemporais(results.data);
                        document.getElementById('lastUpdate').innerText = 'Atualizado às ' + new Date().toLocaleTimeString();
                    }
                    if (callback) callback();
                },
                error: function() {
                    setLog('Erro de conexão/download do CSV.');
                    if (callback) callback();
                }
            });
        }

        function processarDadosTemporais(rawGroup) {
            let tempos = [];
            let acelX = [];
            let acelY = [];
            let acelZ = [];
            let maxZ = 0;
            let ultimoStatus = "Normal";

            let linhasValidasCount = 0;

            rawGroup.forEach((row, idx) => {
                let keys = Object.keys(row);
                let getVal = (nomes) => {
                    let k = keys.find(key => nomes.some(n => key.toLowerCase().trim() === n.toLowerCase().trim() || key.toLowerCase().includes(n.toLowerCase())));
                    return k ? row[k] : null;
                };

                let rawT = getVal(['tempo', 'time', 't']);
                let rawX = getVal(['aceleração x', 'aceleraçao x', 'eixo x', 'x']);
                let rawY = getVal(['aceleração y', 'aceleraçao y', 'eixo y', 'y']);
                let rawZ = getVal(['aceleração z', 'aceleraçao z', 'eixo z', 'z']);

                // Se houver algum valor válido na linha
                if (rawX !== null || rawY !== null || rawZ !== null || rawT !== null) {
                    let t = rawT !== null ? String(rawT).trim() : String(idx);
                    let x = parseNum(rawX);
                    let y = parseNum(rawY);
                    let z = parseNum(rawZ);

                    tempos.push(t);
                    acelX.push(x);
                    acelY.push(y);
                    acelZ.push(z);

                    if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
                    let st = getVal(['status']);
                    if (st && String(st).trim() !== '') ultimoStatus = String(st).trim();

                    linhasValidasCount++;
                }
            });

            totalLeiturasAcumuladas = linhasValidasCount;

            document.getElementById('kpiStatus').innerText = ultimoStatus;
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = totalLeiturasAcumuladas.toLocaleString('pt-BR');

            if (chartAcelInstance) {
                chartAcelInstance.data.labels = tempos;
                chartAcelInstance.data.datasets[0].data = acelX;
                chartAcelInstance.data.datasets[1].data = acelY;
                chartAcelInstance.data.datasets[2].data = acelZ;
                
                // Força atualização imediata
                chartAcelInstance.update();
            }

            setLog(`Sincronizado! ${linhasValidasCount} leituras plotadas.`);
        }

        function carregarDadosFFT() {
            let urlFft = formatarUrlCSV(document.getElementById('csvFftUrl').value);
            if (!urlFft) return;

            const urlSemCache = urlFft + '&_nocache=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosFFT(results.data);
                    }
                }
            });
        }

        function processarDadosFFT(data) {
            let frequencias = [];
            let magnitudes = [];

            data.forEach(row => {
                let keys = Object.keys(row);
                let getVal = (nomes) => {
                    let k = keys.find(key => nomes.some(n => key.toLowerCase().includes(n.toLowerCase())));
                    return k ? row[k] : null;
                };

                let freq = parseNum(getVal(['frequência', 'frequencia', 'freq']));
                let mag = parseNum(getVal(['magnitude', 'amplitude', 'aceleração']));

                frequencias.push(freq.toFixed(2));
                magnitudes.push(mag.toFixed(4));
            });

            if (chartFFTInstance && frequencias.length > 0) {
                chartFFTInstance.data.labels = frequencias;
                chartFFTInstance.data.datasets[0].data = magnitudes;
                chartFFTInstance.update();
            }
        }

        function carregarDadosManualmente() {
            sincronizarTudo();
        }

        function alterarIntervalo() {
            let ms = parseInt(document.getElementById('intervaloSelect').value);
            if (timerLoop) clearInterval(timerLoop);
            timerLoop = setInterval(sincronizarTudo, ms);
        }

        window.onload = function() {
            inicializarGraficos();
            sincronizarTudo();
            alterarIntervalo();
        };
    </script>
</body>
</html>
