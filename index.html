<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural em Tempo Real</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .live-indicator {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: #10B981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES</span>
        <div class="live-indicator">
            <span class="pulse-dot"></span>
            <span>AO VIVO</span>
        </div>
    </div>

    <!-- Controles de Links CSV -->
    <div class="controls">
        <div class="input-group">
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJrkjhKTIPab6OUPAB8jJbrLZ4fcL1c9Hag230BqNA7WVQV9s_5Q3ILW9rdmZ43BI1pNvRsDmPpQJc/pub?gid=1183749713&single=true&output=csv" placeholder="Link do CSV da Aba de Dados...">
        </div>
        <div class="input-group">
            <input type="text" id="csvFftUrl" value="" placeholder="Link do CSV da Aba FFT (deixe em branco para auto-detectar)...">
            <button onclick="carregarDadosManualmente()">Forçar Limpeza e Reinício</button>
            <span id="lastUpdate" class="status-badge">Conectando...</span>
        </div>
    </div>

    <!-- Indicadores KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">0</div>
        </div>
    </div>

    <!-- Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;
        let carregandoEmAndamento = false;
        
        // Memória local estrita para acumular os dados em fila progressiva sem regressões
        let historicoLocal = {
            indices: [],
            tempos: [],
            acelX: [],
            acelY: [],
            acelZ: [],
            maxZGlobal: 0,
            ultimoStatusGlobal: "Normal"
        };

        function parseNum(val) {
            if (typeof val === 'number') return val;
            if (!val) return 0;
            return parseFloat(String(val).replace(',', '.')) || 0;
        }

        function inicializarGraficos() {
            const ctxAcel = document.getElementById('chartAceleracao').getContext('2d');
            chartAcelInstance = new Chart(ctxAcel, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Eixo X', data: [], borderColor: '#EF4444', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Y', data: [], borderColor: '#10B981', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Z', data: [], borderColor: '#3B82F6', borderWidth: 1.5, fill: false, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '1. Tendência Temporal de Aceleração (X, Y, Z)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });

            const ctxFFT = document.getElementById('chartFFT').getContext('2d');
            chartFFTInstance = new Chart(ctxFFT, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Magnitude Z (g)',
                        data: [],
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência - Eixo Z (Aba FFT)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function carregarDadosManualmente() {
            // Reseta a memória local para reiniciar do zero
            historicoLocal = { indices: [], tempos: [], acelX: [], acelY: [], acelZ: [], maxZGlobal: 0, ultimoStatusGlobal: "Normal" };
            carregarDados();
        }

        function carregarDados() {
            if (carregandoEmAndamento) return;
            carregandoEmAndamento = true;

            let url = document.getElementById('csvUrl').value.trim();
            if (!url) {
                carregandoEmAndamento = false;
                return;
            }

            if (url.includes('pubhtml')) {
                url = url.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlSemCache = url + (url.includes('?') ? '&' : '?') + '_t=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosAcumulativos(results.data);
                        document.getElementById('lastUpdate').innerText = 'Atualizado às ' + new Date().toLocaleTimeString();
                    }
                    carregarDadosFFT(url);
                },
                error: function(err) {
                    console.error('Erro na aba de Dados:', err);
                    carregandoEmAndamento = false;
                }
            });
        }

        function carregarDadosFFT(urlBase) {
            let urlFft = document.getElementById('csvFftUrl').value.trim();

            if (!urlFft) {
                // Altera o GID para a aba FFT (gid=1 ou ajuste conforme sua planilha)
                urlFft = urlBase.replace(/gid=\d+/, 'gid=1'); 
            }

            if (urlFft.includes('pubhtml')) {
                urlFft = urlFft.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlFftSemCache = urlFft + (urlFft.includes('?') ? '&' : '?') + '_t=' + new Date().getTime();

            Papa.parse(urlFftSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosFFT(results.data);
                    }
                    carregandoEmAndamento = false;
                },
                error: function(err) {
                    console.error('Aviso: Aba FFT ainda não publicada ou ignorada.', err);
                    carregandoEmAndamento = false;
                }
            });
        }

        function processarDadosAcumulativos(data) {
            // Só aceita processar se a quantidade de linhas da planilha for MAIOR ou IGUAL à nossa memória 
            // (evita que o cache antigo do Google Sheets faça o painel recuar)
            if (data.length >= historicoLocal.indices.length) {
                let inicioIndex = historicoLocal.indices.length;

                for (let i = inicioIndex; i < data.length; i++) {
                    let row = data[i];
                    let numeroSequencia = i + 1; // Fila estrita 1, 2, 3, 4...
                    
                    let t = parseNum(row['Tempo (s)'] || row['Tempo'] || 0);
                    let x = parseNum(row['Aceleração X (g)'] || row['Aceleração X'] || row['Aceleraçao X (g)'] || 0);
                    let y = parseNum(row['Aceleração Y (g)'] || row['Aceleração Y'] || row['Aceleraçao Y (g)'] || 0);
                    let z = parseNum(row['Aceleração Z (g)'] || row['Aceleração Z'] || row['Aceleraçao Z (g)'] || 0);

                    historicoLocal.indices.push(numeroSequencia);
                    historicoLocal.tempos.push(t);
                    historicoLocal.acelX.push(x);
                    historicoLocal.acelY.push(y);
                    historicoLocal.acelZ.push(z);

                    if (Math.abs(z) > historicoLocal.maxZGlobal) {
                        historicoLocal.maxZGlobal = Math.abs(z);
                    }
                    if (row['Status'] || row['Status Estrutural']) {
                        historicoLocal.ultimoStatusGlobal = row['Status'] || row['Status Estrutural'];
                    }
                }
            }

            // Atualiza os KPIs visuais com os dados consolidados
            document.getElementById('kpiStatus').innerText = historicoLocal.ultimoStatusGlobal;
            document.getElementById('kpiMaxZ').innerText = historicoLocal.maxZGlobal.toFixed(4);
            document.getElementById('kpiLeituras').innerText = historicoLocal.indices.length.toLocaleString('pt-BR');

            // Renderiza o gráfico usando o índice sequencial perfeito (1, 2, 3, 4...) no eixo X
            chartAcelInstance.data.labels = historicoLocal.indices;
            chartAcelInstance.data.datasets[0].data = historicoLocal.acelX;
            chartAcelInstance.data.datasets[1].data = historicoLocal.acelY;
            chartAcelInstance.data.datasets[2].data = historicoLocal.acelZ;
            chartAcelInstance.update('none');
        }

        function processarDadosFFT(data) {
            let ultimaLinha = data[data.length - 1];
            if (!ultimaLinha) return;
            
            let ultimoTempoFFT = ultimaLinha['Tempo (s)'] || ultimaLinha['Tempo'];
            let frequencias = [];
            let magnitudes = [];

            data.forEach(row => {
                if (!ultimoTempoFFT || row['Tempo (s)'] === ultimoTempoFFT || row['Tempo'] === ultimoTempoFFT) {
                    let freq = parseNum(row['Frequência (Hz)'] || row['Frequencia (Hz)'] || row['Freq Z (Hz)'] || row['Frequência'] || row['Frequencia'] || row['Freq'] || 0);
                    let mag = parseNum(row['Magnitude'] || row['Magnitude (g)'] || row['Mag Z (g)'] || row['Amplitude'] || row['Aceleração (g)'] || 0);

                    if (freq > 0 || mag > 0) {
                        frequencias.push(freq.toFixed(2));
                        magnitudes.push(mag.toFixed(4));
                    }
                }
            });

            if (frequencias.length > 0) {
                chartFFTInstance.data.labels = frequencias;
                chartFFTInstance.data.datasets[0].data = magnitudes;
                chartFFTInstance.update('none');
            }
        }

        // Inicialização do painel
        inicializarGraficos();
        carregarDados();

        // Consulta automática a cada 1.5 segundos
        setInterval(carregarDados, 1500);
    </script>
</body>
</html>
