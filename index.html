<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }
    </style>
</head>
<body>

    <div class="header">
        ⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES
    </div>

    <!-- Campo para inserir o Link do CSV da Planilha -->
    <div class="controls">
        <input type="text" id="csvUrl" placeholder="Cole o Link do CSV Publicado da sua Planilha aqui...">
        <button onclick="carregarDados()">Carregar Dados</button>
    </div>

    <!-- Indicadores KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">--</div>
        </div>
    </div>

    <!-- Seção dos Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;

        function carregarDados() {
            const url = document.getElementById('csvUrl').value.trim();
            if (!url) {
                alert('Por favor, insira a URL do arquivo CSV publicado.');
                return;
            }

            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    processarDados(results.data);
                },
                error: function(err) {
                    alert('Erro ao carregar os dados. Verifique o link e se a planilha foi publicada como CSV.');
                }
            });
        }

        function processarDados(data) {
            let tempos = [];
            let acelX = [];
            let acelY = [];
            let acelZ = [];
            let maxZ = 0;
            let ultimoStatus = "Normal";

            data.forEach(row => {
                let t = parseFloat(row['Tempo (s)']) || 0;
                let x = parseFloat(row['Aceleração X (g)']) || 0;
                let y = parseFloat(row['Aceleração Y (g)']) || 0;
                let z = parseFloat(row['Aceleração Z (g)']) || 0;

                tempos.push(t);
                acelX.push(x);
                acelY.push(y);
                acelZ.push(z);

                if (z > maxZ) maxZ = z;
                if (row['Status']) ultimoStatus = row['Status'];
            });

            // Atualizar KPIs
            document.getElementById('kpiStatus').innerText = ultimoStatus;
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = data.length;

            // Renderizar Gráficos
            renderizarGraficoAceleracao(tempos, acelX, acelY, acelZ);
            renderizarGraficoFFT(acelX, tempos);
        }

        function renderizarGraficoAceleracao(tempos, x, y, z) {
            const ctx = document.getElementById('chartAceleracao').getContext('2d');
            if (chartAcelInstance) chartAcelInstance.destroy();

            chartAcelInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: tempos,
                    datasets: [
                        { label: 'Eixo X', data: x, borderColor: '#EF4444', borderWidth: 1.5, fill: false },
                        { label: 'Eixo Y', data: y, borderColor: '#10B981', borderWidth: 1.5, fill: false },
                        { label: 'Eixo Z', data: z, borderColor: '#3B82F6', borderWidth: 1.5, fill: false }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: '1. Tendência Temporal de Aceleração (Eixos X, Y, Z)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function renderizarGraficoFFT(sinalX, tempos) {
            const N = sinalX.length;
            if (N < 2) return;

            let dt = (tempos[N - 1] - tempos[0]) / (N - 1);
            if (!dt || dt <= 0) dt = 0.01;
            const Fs = 1 / dt;

            let freqs = [];
            let magnitudes = [];

            const numBins = Math.floor(N / 2);
            for (let k = 0; k < numBins; k++) {
                let real = 0;
                let imag = 0;
                let freq = (k * Fs) / N;

                for (let n = 0; n < N; n++) {
                    let angle = (2 * Math.PI * k * n) / N;
                    real += sinalX[n] * Math.cos(angle);
                    imag -= sinalX[n] * Math.sin(angle);
                }

                let mag = (Math.sqrt(real * real + imag * imag) / N) * 2;
                freqs.push(freq.toFixed(2));
                magnitudes.push(mag.toFixed(4));
            }

            const ctx = document.getElementById('chartFFT').getContext('2d');
            if (chartFFTInstance) chartFFTInstance.destroy();

            chartFFTInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: freqs,
                    datasets: [{
                        label: 'Magnitude (g)',
                        data: magnitudes,
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência - Eixo X (FFT)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
