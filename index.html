<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="header">
        ⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES
    </div>

    <!-- Campo para inserir o Link do CSV da Planilha -->
    <div class="controls">
        <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJrkjhKTIPab6OUPAB8jJbrLZ4fcL1c9Hag230BqNA7WVQV9s_5Q3ILW9rdmZ43BI1pNvRsDmPpQJc/pub?gid=1183749713&single=true&output=csv" placeholder="Cole o Link do CSV Publicado da sua Planilha aqui...">
        <button onclick="carregarDados()">Atualizar Agora</button>
        <span id="lastUpdate" class="status-badge">Aguardando dados...</span>
    </div>

    <!-- Indicadores KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">0</div>
        </div>
    </div>

    <!-- Seção dos Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;
        let totalLeiturasAcumuladas = 0; // Controla o total acumulado para impedir oscilação para baixo

        // Inicializa a estrutura dos gráficos no carregamento da página
        function inicializarGraficos() {
            const ctxAcel = document.getElementById('chartAceleracao').getContext('2d');
            chartAcelInstance = new Chart(ctxAcel, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Eixo X', data: [], borderColor: '#EF4444', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Y', data: [], borderColor: '#10B981', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Z', data: [], borderColor: '#3B82F6', borderWidth: 1.5, fill: false, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '1. Tendência Temporal de Aceleração (Eixos X, Y, Z)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });

            const ctxFFT = document.getElementById('chartFFT').getContext('2d');
            chartFFTInstance = new Chart(ctxFFT, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Magnitude (g)',
                        data: [],
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência - Eixo X (FFT)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function carregarDados() {
            let url = document.getElementById('csvUrl').value.trim();
            if (!url) {
                alert('Por favor, insira a URL do arquivo CSV publicado.');
                return;
            }

            // Normaliza a URL para garantir que baixe o formato CSV direto
            if (url.includes('pubhtml')) {
                url = url.replace('pubhtml', 'pub');
            }
            if (!url.includes('output=csv')) {
                url += (url.includes('?') ? '&' : '?') + 'output=csv';
            }

            // Garante que o navegador recarregue o CSV sem usar cache
            const urlSemCache = url + '&_t=' + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        // REGRA PRINCIPAL: só atualiza se a nova leitura for maior ou igual ao total acumulado
                        if (results.data.length >= totalLeiturasAcumuladas) {
                            totalLeiturasAcumuladas = results.data.length;
                            processarDados(results.data);
                            document.getElementById('lastUpdate').innerText = 'Última atualização: ' + new Date().toLocaleTimeString();
                        }
                    }
                },
                error: function(err) {
                    console.error('Erro ao carregar os dados:', err);
                }
            });
        }

        function processarDados(data) {
            let tempos = [];
            let acelX = [];
            let acelY = [];
            let acelZ = [];
            let maxZ = 0;
            let ultimoStatus = "Normal";

            data.forEach(row => {
                let t = parseFloat(row['Tempo (s)']) || 0;
                let x = parseFloat(row['Aceleração X (g)']) || 0;
                let y = parseFloat(row['Aceleração Y (g)']) || 0;
                let z = parseFloat(row['Aceleração Z (g)']) || 0;

                tempos.push(t);
                acelX.push(x);
                acelY.push(y);
                acelZ.push(z);

                if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
                if (row['Status']) ultimoStatus = row['Status'];
            });

            // Atualização dos KPIs
            document.getElementById('kpiStatus').innerText = ultimoStatus;
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = data.length.toLocaleString('pt-BR');

            // Atualização contínua do gráfico de aceleração
            chartAcelInstance.data.labels = tempos;
            chartAcelInstance.data.datasets[0].data = acelX;
            chartAcelInstance.data.datasets[1].data = acelY;
            chartAcelInstance.data.datasets[2].data = acelZ;
            chartAcelInstance.update('none');

            // Atualização do gráfico de FFT
            atualizarFFT(acelX, tempos);
        }

        function atualizarFFT(sinalX, tempos) {
            const N = sinalX.length;
            if (N < 2) return;

            let dt = (tempos[N - 1] - tempos[0]) / (N - 1);
            if (!dt || dt <= 0) dt = 0.01;
            const Fs = 1 / dt;

            let freqs = [];
            let magnitudes = [];

            const numBins = Math.floor(N / 2);
            for (let k = 0; k < numBins; k++) {
                let real = 0;
                let imag = 0;

                for (let n = 0; n < N; n++) {
                    let angle = (2 * Math.PI * k * n) / N;
                    real += sinalX[n] * Math.cos(angle);
                    imag -= sinalX[n] * Math.sin(angle);
                }

                let mag = (Math.sqrt(real * real + imag * imag) / N) * 2;
                freqs.push(((k * Fs) / N).toFixed(2));
                magnitudes.push(mag.toFixed(4));
            }

            chartFFTInstance.data.labels = freqs;
            chartFFTInstance.data.datasets[0].data = magnitudes;
            chartFFTInstance.update('none');
        }

        // 1. Cria a estrutura gráfica primeiro
        inicializarGraficos();

        // 2. Executa a primeira busca de dados
        carregarDados();

        // 3. Atualiza os dados a cada 5 segundos
        setInterval(carregarDados, 5000);
    </script>
</body>
</html>
