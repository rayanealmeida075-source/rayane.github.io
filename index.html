<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento Estrutural</title>
    <!-- Chart.js para geração de gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse para leitura fácil de arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #F8FAFC;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .kpi-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: space-between;
        }

        .kpi-card {
            background-color: #1E293B;
            flex: 1;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border-top: 4px solid #3B82F6;
        }

        .kpi-title {
            font-size: 0.8rem;
            color: #94A3B8;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .kpi-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: #1E293B;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        canvas {
            max-width: 100%;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #334155;
            background-color: #1E293B;
            color: #FFF;
        }

        button {
            padding: 10px 20px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563EB;
        }

        .status-badge {
            font-size: 0.85rem;
            color: #10B981;
            font-weight: 500;
        }

        label {
            color: #CBD5E1;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        ⚡ PAINEL DE MONITORAMENTO ESTRUTURAL & ANÁLISE DE VIBRAÇÕES
    </div>

    <!-- Campo para inserir os Links dos CSVs das Planilhas -->
    <div class="controls">
        <div class="input-group">
            <input type="text" id="csvUrl" value="https://docs.google.com/spreadsheets/d/e/2PACX-1vQJrkjhKTIPab6OUPAB8jJbrLZ4fcL1c9Hag230BqNA7WVQV9s_5Q3ILW9rdmZ43BI1pNvRsDmPpQJc/pub?gid=1183749713&single=true&output=csv" placeholder="Link do CSV da Aba de Dados...">
        </div>
        <div class="input-group">
            <input type="text" id="csvFftUrl" value="" placeholder="Link do CSV da Aba FFT (opcional, informe se o ID da aba for diferente)...">
            <button onclick="carregarDados()">Atualizar Agora</button>
            <span id="lastUpdate" class="status-badge">Aguardando dados...</span>
        </div>
        <!-- NOVO: Campo de intervalo do eixo X -->
        <div class="input-group">
            <label for="intervalo">Intervalo do eixo X (s):</label>
            <input type="number" id="intervalo" value="10" min="1" step="1" style="max-width:120px;">
            <span id="janelaAtual" class="status-badge">Janela: -- a --</span>
        </div>
    </div>

    <!-- Indicadores KPI -->
    <div class="kpi-container">
        <div class="kpi-card" style="border-color: #3B82F6;">
            <div class="kpi-title">ÚLTIMO STATUS</div>
            <div class="kpi-value" id="kpiStatus">--</div>
        </div>
        <div class="kpi-card" style="border-color: #10B981;">
            <div class="kpi-title">ACELERAÇÃO MÁX. Z (g)</div>
            <div class="kpi-value" id="kpiMaxZ">--</div>
        </div>
        <div class="kpi-card" style="border-color: #F59E0B;">
            <div class="kpi-title">TOTAL DE LEITURAS</div>
            <div class="kpi-value" id="kpiLeituras">0</div>
        </div>
    </div>

    <!-- Seção dos Gráficos -->
    <div class="charts-grid">
        <div class="chart-card">
            <canvas id="chartAceleracao"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="chartFFT"></canvas>
        </div>
    </div>

    <script>
        let chartAcelInstance = null;
        let chartFFTInstance = null;

        // 👇 Variáveis para controle da janela deslizante do eixo X
        let janelaInicio = 0;      // início atual da janela no eixo X
        let janelaFim = 10;        // fim atual da janela
        let dadosCompletos = [];   // guarda TODOS os dados brutos carregados
        let ultimoTempoMax = 0;    // maior tempo já visto (para saber quando avançar)

        // Função utilitária para converter qualquer formato numérico (com vírgula ou ponto) em float
        function parseNum(val) {
            if (typeof val === 'number') return val;
            if (val === null || val === undefined || val === '') return null;
            let str = String(val).trim().replace(',', '.');
            let num = parseFloat(str);
            return isNaN(num) ? null : num;
        }

        // Encontra o nome da coluna no CSV de forma flexível (sem diferenciar maiúsculas/acentos)
        function obterValorColuna(row, palavrasChave) {
            const chaves = Object.keys(row);
            for (let chave of chaves) {
                const chaveNorm = chave.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                for (let pc of palavrasChave) {
                    if (chaveNorm.includes(pc)) {
                        let v = parseNum(row[chave]);
                        if (v !== null) return v;
                    }
                }
            }
            return null;
        }

        // Lê o campo de intervalo (valor em segundos)
        function obterIntervalo() {
            let v = parseFloat(document.getElementById('intervalo').value);
            return (isNaN(v) || v <= 0) ? 10 : v;
        }

        function inicializarGraficos() {
            const ctxAcel = document.getElementById('chartAceleracao').getContext('2d');
            chartAcelInstance = new Chart(ctxAcel, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Eixo X', data: [], borderColor: '#EF4444', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Y', data: [], borderColor: '#10B981', borderWidth: 1.5, fill: false, pointRadius: 0 },
                        { label: 'Eixo Z', data: [], borderColor: '#3B82F6', borderWidth: 1.5, fill: false, pointRadius: 0 }
                    ]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '1. Tendência Temporal de Aceleração (Eixos X, Y, Z)', color: '#F8FAFC' },
                        legend: { labels: { color: '#CBD5E1' } }
                    },
                    scales: {
                        x: {
                            type: 'linear',   // 👈 eixo numérico (permite min/max reais)
                            min: 0,
                            max: 10,
                            title: { display: true, text: 'Tempo (s)', color: '#CBD5E1' },
                            ticks: { color: '#CBD5E1' },
                            grid: { color: '#334155' }
                        },
                        y: { ticks: { color: '#CBD5E1' }, grid: { color: '#334155' } }
                    }
                }
            });

            const ctxFFT = document.getElementById('chartFFT').getContext('2d');
            chartFFTInstance = new Chart(ctxFFT, {
                type: 'bar',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Magnitude (g)',
                        data: [],
                        backgroundColor: '#8B5CF6'
                    }]
                },
                options: {
                    responsive: true,
                    animation: false,
                    plugins: {
                        title: { display: true, text: '2. Espectro de Frequência (Aba FFT)', color: '#F8FAFC' },
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Frequência (Hz)', color: '#CBD5E1' },
                            ticks: { color: '#CBD5E1' },
                            grid: { color: '#334155' }
                        },
                        y: {
                            title: { display: true, text: 'Magnitude / Amplitude', color: '#CBD5E1' },
                            ticks: { color: '#CBD5E1' },
                            grid: { color: '#334155' }
                        }
                    }
                }
            });
        }

        function carregarDados() {
            let url = document.getElementById('csvUrl').value.trim();
            if (!url) {
                alert('Por favor, insira a URL do arquivo CSV publicado.');
                return;
            }

            if (url.includes('pubhtml')) {
                url = url.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlSemCache = url + (url.includes('?') ? '&' : '?') + '_t=' + new Date().getTime();

            // 1. Carrega os dados temporais
            Papa.parse(urlSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDados(results.data);
                        document.getElementById('lastUpdate').innerText = 'Última atualização: ' + new Date().toLocaleTimeString();
                    }
                },
                error: function(err) {
                    console.error('Erro ao carregar os dados temporais:', err);
                }
            });

            // 2. Carrega a aba FFT
            carregarDadosFFT(url);
        }

        function carregarDadosFFT(urlBase) {
            let urlFft = document.getElementById('csvFftUrl').value.trim();

            if (!urlFft) {
                // Tenta trocar a gid para a primeira aba (gid=0) se não for especificada
                urlFft = urlBase.replace(/gid=\d+/, 'gid=0');
            }

            if (urlFft.includes('pubhtml')) {
                urlFft = urlFft.replace('pubhtml', 'pub') + '&output=csv';
            }

            const urlFftSemCache = urlFft + (urlFft.includes('?') ? '&' : '?') + '_t=' + new Date().getTime();

            Papa.parse(urlFftSemCache, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    if (results.data && results.data.length > 0) {
                        processarDadosFFT(results.data);
                    }
                },
                error: function(err) {
                    console.error('Erro ao carregar os dados da aba FFT:', err);
                }
            });
        }

        function processarDados(data) {
            // Guarda os dados brutos para reprocessar quando a janela mudar
            dadosCompletos = data;

            // Atualiza os KPIs (sempre com base em TODOS os dados)
            let maxZ = 0;
            data.forEach(row => {
                let z = obterValorColuna(row, ['aceleracao z', 'acel z', 'eixo z', 'z']) ?? 0;
                if (Math.abs(z) > maxZ) maxZ = Math.abs(z);
            });

            // Pega o status da ÚLTIMA linha (correção em relação ao código original)
            let ultimoStatus = "Normal";
            if (data.length > 0) {
                const ultimaLinha = data[data.length - 1];
                for (let k in ultimaLinha) {
                    if (k.toLowerCase().includes('status')) {
                        ultimoStatus = ultimaLinha[k];
                        break;
                    }
                }
            }

            document.getElementById('kpiStatus').innerText = ultimoStatus;
            document.getElementById('kpiMaxZ').innerText = maxZ.toFixed(4);
            document.getElementById('kpiLeituras').innerText = data.length.toLocaleString('pt-BR');

            // Aplica a janela deslizante
            aplicarJanela();
        }

        // 👇 Filtra os dados pela janela atual e desenha no gráfico
        function aplicarJanela() {
            if (dadosCompletos.length === 0) return;

            // Descobre o maior tempo dos dados atuais
            let temposTodos = dadosCompletos.map(row =>
                obterValorColuna(row, ['tempo', 'time', 't']) ?? 0
            );
            ultimoTempoMax = Math.max(...temposTodos);

            // Garante que janelaFim reflita o intervalo atual do campo
            const intervalo = obterIntervalo();
            if ((janelaFim - janelaInicio) !== intervalo) {
                // Se o usuário alterou o campo mas ainda não disparou o evento, ajusta
                janelaInicio = 0;
                janelaFim = intervalo;
            }

            // Se o tempo máximo já passou do fim da janela, avança a janela
            while (ultimoTempoMax >= janelaFim) {
                janelaInicio = janelaFim;
                janelaFim = janelaInicio + intervalo;
            }

            // Filtra os pontos que estão dentro da janela atual
            let pontosX = [], pontosY = [], pontosZ = [];

            dadosCompletos.forEach(row => {
                let t = obterValorColuna(row, ['tempo', 'time', 't']) ?? 0;
                if (t >= janelaInicio && t <= janelaFim) {
                    pontosX.push({ x: t, y: obterValorColuna(row, ['aceleracao x', 'acel x', 'eixo x', 'x']) ?? 0 });
                    pontosY.push({ x: t, y: obterValorColuna(row, ['aceleracao y', 'acel y', 'eixo y', 'y']) ?? 0 });
                    pontosZ.push({ x: t, y: obterValorColuna(row, ['aceleracao z', 'acel z', 'eixo z', 'z']) ?? 0 });
                }
            });

            // Atualiza datasets
            chartAcelInstance.data.datasets[0].data = pontosX;
            chartAcelInstance.data.datasets[1].data = pontosY;
            chartAcelInstance.data.datasets[2].data = pontosZ;

            // Fixa a faixa do eixo X na janela atual
            chartAcelInstance.options.scales.x.min = janelaInicio;
            chartAcelInstance.options.scales.x.max = janelaFim;

            chartAcelInstance.update('none');

            // Atualiza o indicador visual da janela
            document.getElementById('janelaAtual').innerText =
                `Janela: ${janelaInicio} a ${janelaFim}`;
        }

        function processarDadosFFT(data) {
            let frequencias = [];
            let magnitudes = [];

            // Pega as chaves da primeira linha para entender a estrutura
            let colunas = Object.keys(data[0] || {});

            data.forEach((row, index) => {
                let freq = null;
                let mag = null;

                // Tenta mapear dinamicamente por palavras-chave
                freq = obterValorColuna(row, ['frequenc', 'freq', 'hz']);
                mag = obterValorColuna(row, ['magnitud', 'amplitud', 'acelerac', 'mag', 'g']);

                // Se não encontrou por palavra-chave, tenta pegar a 1ª coluna como Frequência e 2ª como Magnitude
                if (freq === null && colunas.length >= 1) {
                    freq = parseNum(row[colunas[0]]);
                }
                if (mag === null && colunas.length >= 2) {
                    mag = parseNum(row[colunas[1]]);
                }

                if (freq !== null && mag !== null) {
                    // Formatação inteligente da frequência para o rótulo
                    frequencias.push(Number.isInteger(freq) ? freq.toString() : freq.toFixed(2));
                    magnitudes.push(mag);
                }
            });

            if (frequencias.length > 0) {
                chartFFTInstance.data.labels = frequencias;
                chartFFTInstance.data.datasets[0].data = magnitudes;
                chartFFTInstance.update('none');
            }
        }

        // Quando o usuário mudar o intervalo, reinicia a janela do zero
        document.getElementById('intervalo').addEventListener('change', function() {
            janelaInicio = 0;
            janelaFim = obterIntervalo();
            aplicarJanela();
        });

        inicializarGraficos();
        carregarDados();
        setInterval(carregarDados, 5000);
    </script>
</body>
</html>
